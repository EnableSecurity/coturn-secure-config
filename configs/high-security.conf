# High-Security coturn Configuration
# Profile: high-security
# Based on: https://www.enablesecurity.com/blog/coturn-security-configuration-guide/

# Listening configuration
listening-port=3478
tls-listening-port=5349
# listening-ip not set: coturn listens on all available addresses

# Relay configuration
# Set external-ip to your server's public IP in production
# relay-ip not set: coturn auto-detects available addresses
min-port=49152
max-port=49252

# Authentication
lt-cred-mech
use-auth-secret
static-auth-secret=testing-secret-do-not-use-in-production
realm=turn.example.com

# TLS - enforce strong encryption
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/privkey.pem
cipher-list="ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
# TLS 1.0 and 1.1 are disabled by default since coturn 4.7.0
# On coturn <= 4.6.x, uncomment the following two lines:
# no-tlsv1
# no-tlsv1_1
no-tlsv1_2

# Access control - allowlist approach
# In production, replace with your actual media server IPs
allowed-peer-ip=8.8.8.8
allowed-peer-ip=2001:4860:4860::8888
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Protocol hardening
no-udp
# no-udp alone leaves DTLS enabled before coturn 4.17.0
no-dtls
no-tcp
no-rfc5780
no-tcp-relay
no-multicast-peers
no-cli
secure-stun
# unauthorized-ratelimit (UDP 401 reflection control) is not needed here:
# no-udp already removes the plain UDP listener that reflection targets

# Aggressive rate limiting
user-quota=50
total-quota=5000
max-allocate-lifetime=1800
max-bps=5000000
bps-capacity=500000000
channel-lifetime=300
permission-lifetime=180

# Logging
verbose
log-binding

# Security hardening
no-software-attribute
stale-nonce=300
