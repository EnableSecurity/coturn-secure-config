# Intentionally Insecure coturn Configuration
# Profile: insecure
# Purpose: negative testing only. Do NOT use in production.

# Listening configuration
listening-port=3478
tls-listening-port=5349

# Relay configuration
min-port=49152
max-port=49252

# Authentication
lt-cred-mech
use-auth-secret
static-auth-secret=testing-secret-do-not-use-in-production
realm=turn.example.com

# Intentionally insecure access control:
# - explicitly allow loopback peers
# - keep multicast peers enabled by omitting no-multicast-peers
# - no denied-peer-ip rules
# This allows relay to internal/special addresses and should be caught by tests.
allow-loopback-peers

# Intentionally expand attack surface
rfc5780
software-attribute

# Intentionally insecure management interface
cli-ip=0.0.0.0
cli-port=5766
cli-password=admin

# Intentionally weak limits
user-quota=0
total-quota=0
max-allocate-lifetime=3600

# Keep verbose logging for test visibility
verbose
