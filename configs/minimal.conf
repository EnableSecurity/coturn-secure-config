# Minimal Secure coturn Configuration
# Profile: minimal
# Based on: https://www.enablesecurity.com/blog/coturn-security-configuration-guide/

# Listening configuration
listening-port=3478
tls-listening-port=5349
# listening-ip not set: coturn listens on all available addresses

# Relay configuration
# Set external-ip to your server's public IP in production
# relay-ip not set: coturn auto-detects available addresses
min-port=49152
max-port=49252

# Authentication
lt-cred-mech
use-auth-secret
static-auth-secret=testing-secret-do-not-use-in-production
realm=turn.example.com

# Access control - block internal ranges
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Rate limiting
user-quota=100
total-quota=10000
max-allocate-lifetime=3600

# Logging (stdout for Docker)
verbose
